<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spam Email Classifier</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f7fb;
        }

        .container {
            max-width: 850px;
            margin: 60px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        .description {
            color: #666;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            min-height: 260px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
            resize: vertical;
        }

        button {
            margin-top: 15px;
            padding: 13px 25px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            opacity: 0.85;
        }

        #result {
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
        }

        #confidence {
            margin-top: 8px;
            color: #666;
        }

        .model-info {
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>📧 Spam Email Classifier</h1>

            <p class="description">
                Enter an email message below to classify it as
                <b>SPAM</b> or <b>HAM</b>.
            </p>

            <textarea
                id="message"
                placeholder="Paste your email message here..."
            ></textarea>

            <br>

            <button onclick="predict()">
                Check Email
            </button>

            <div id="result"></div>

            <div id="confidence"></div>

            <div class="model-info">
                NLP Model: CountVectorizer (Bag of Words)
                + Multinomial Naive Bayes
            </div>

        </div>

    </div>


    <script>

        async function predict() {

            const message =
                document.getElementById("message").value.trim();

            const result =
                document.getElementById("result");

            const confidence =
                document.getElementById("confidence");


            if (!message) {

                result.textContent =
                    "Please enter an email message.";

                confidence.textContent = "";

                return;
            }


            result.textContent = "Checking email...";
            confidence.textContent = "";


            try {

                const response = await fetch("/api/predict", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })

                });


                const data = await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error || "Prediction failed"
                    );

                }


                result.textContent =
                    "Prediction: " + data.prediction;


                if (data.confidence !== undefined) {

                    confidence.textContent =
                        "Confidence: " +
                        data.confidence +
                        "%";

                }

            }

            catch (error) {

                result.textContent =
                    "Error: " + error.message;

                confidence.textContent = "";

            }

        }

    </script>

</body>

</html>
